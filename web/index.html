<!doctype html>
<html lang="pt-PT" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MediaForge — conversor de ficheiros e downloader multimédia</title>
    <meta
      name="description"
      content="Converte documentos, imagens, áudio e vídeo, e descarrega vídeo e música a partir de um link. Tudo num único hub, sem instalar nada."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b09" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0b09'/%3E%3Cpath d='M8 23V9l8 8 8-8v14' stroke='%23c7f53f' stroke-width='3' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <script>
      // Aplica o tema antes da primeira pintura para não haver flash.
      ;(() => {
        try {
          const saved = localStorage.getItem('mediaforge.theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
